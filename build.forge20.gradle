plugins {
	id 'mod-platform'
}

apply plugin: 'net.minecraftforge.gradle'

minecraft {
	mappings channel: 'official', version: project.property('deps.minecraft')

	def atFile = rootProject.file("src/main/resources/aw/${stonecutter.current.version}.cfg")
	if (atFile.exists()) {
		accessTransformers.from(atFile)
	}

	runs {
		client {
			workingDir = project.file('run')
			systemProperty 'forge.logging.console.level', 'debug'
			args '--username', 'Player'
			args '-mixin.config=' + project.property('mod.id') + '.mixins.json'
			mods {
				"${project.property('mod.id')}" {
					source sourceSets.main
				}
			}
		}
		server {
			workingDir = project.file('run')
			systemProperty 'forge.logging.console.level', 'debug'
			args '-mixin.config=' + project.property('mod.id') + '.mixins.json'
			mods {
				"${project.property('mod.id')}" {
					source sourceSets.main
				}
			}
		}
	}
}

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:${project.property('deps.forge')}")
	annotationProcessor "org.spongepowered:mixin:${libs.versions.mixin.get()}:processor"
	implementation libs.moulberry.mixinconstraints
	jarJar libs.moulberry.mixinconstraints
}

sourceSets {
	main {
		resources.srcDir "${rootDir}/versions/datagen/${stonecutter.current.version.split('-')[0]}/src/main/generated"
	}
}

tasks.named('createMinecraftArtifacts') {
	dependsOn tasks.named('stonecutterGenerate')
}
